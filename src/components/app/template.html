                ${otherEntities.map(e => `<option value="${e.id}">${e.display_name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Cardinality</label>
              <select id="rel-cardinality">
                <option value="1:1">One to One (1:1)</option>
                <option value="1:N" selected>One to Many (1:N)</option>
                <option value="N:1">Many to One (N:1)</option>
                <option value="N:M">Many to Many (N:M)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Foreign Key Field</label>
              <input type="text" id="rel-fk-field" placeholder="e.g., fund_id, security_id">
              <div class="hint">Field in this entity that references the related entity</div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="btn btn-primary" onclick="saveRelationship('${entityId}')">Create</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
    }

    async function saveRelationship(entityId) {
      const relType = document.getElementById('rel-type').value;
      const relatedEntityId = document.getElementById('rel-entity').value;
      const cardinality = document.getElementById('rel-cardinality').value;
      const fkField = document.getElementById('rel-fk-field').value.trim();

      if (!relatedEntityId) {
        alert('Please select a related entity');
        return;
      }

      const data = {
        parent_entity_id: relType === 'parent' ? relatedEntityId : entityId,
        child_entity_id: relType === 'parent' ? entityId : relatedEntityId,
        relationship_type: relType,
        cardinality,
        foreign_key_field: fkField
      };

      try {
        await apiCreateRecord('SchemaRelationship', data);
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to create relationship: ' + err.message);
      }
    }

    // ===== Template Editor =====
    function renderTemplateSection(entityId, fields) {
      const templates = (records.EntityTemplate || []).filter(t => t.entity_id === entityId);
      const defaultTemplate = templates.find(t => t.is_default);

      return `
        <div class="template-section" style="margin-top: 28px;">
          <div class="template-section-head">
            <div class="template-section-name">Display Templates</div>
            <button class="btn btn-sm" onclick="openTemplateEditor('${entityId}')">+ New Template</button>
          </div>
          ${templates.length > 0 ? templates.map(t => `
            <div class="template-card" onclick="openTemplateEditor('${entityId}', '${t.id}')">
              <div class="template-card-info">
                <div class="template-card-name">
                  ${t.name}
                  ${t.is_default ? '<span class="template-default-badge">Default</span>' : ''}
                </div>
                <div class="template-card-meta">
                  <span>v${t.version || 1}</span>
                  <span>Updated ${t.updated_at ? new Date(t.updated_at).toLocaleDateString() : '—'}</span>
                </div>
              </div>
              <div style="display: flex; gap: 6px;">
                <button class="field-action-btn" onclick="event.stopPropagation(); openTemplateEditor('${entityId}', '${t.id}')">Edit</button>
                <button class="field-action-btn delete" onclick="event.stopPropagation(); deleteTemplate('${t.id}')">Delete</button>
              </div>
            </div>
          `).join('') : `
            <div style="padding: 20px; text-align: center; color: var(--ink-4); font-size: 12px;">
              No templates yet. Create one to control how records of this entity are displayed.
            </div>
          `}
        </div>
      `;
    }

    function openTemplateEditor(entityId, editId = null) {
      const templates = records.EntityTemplate || [];
      const template = editId ? templates.find(t => t.id === editId) : null;
      const schemaEntities = records.SchemaEntity || [];
      const schemaFields = records.SchemaField || [];
      const entity = schemaEntities.find(e => e.id === entityId);
      const fields = schemaFields.filter(f => f.entity_id === entityId).sort((a, b) => (a.display_order || 0) - (b.display_order || 0));

      const defaultHtml = template?.html_content || generateDefaultTemplateHtml(entity, fields);

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

      modal.innerHTML = `
        <div class="modal-panel-wide">
          <div class="modal-head">
            <div class="modal-title">${template ? 'Edit Template' : 'New Template'} — ${entity?.display_name || entity?.name || ''}</div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <button class="btn btn-sm" onclick="previewTemplate()">Preview</button>
              <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button>
            </div>
          </div>
          <div style="padding: 12px 16px; border-bottom: 1px solid var(--line);">
            <div class="form-row-2" style="margin: 0;">
              <div class="form-group" style="margin: 0;">
                <label>Template Name</label>
                <input type="text" id="template-name" value="${template?.name || 'Default Template'}" placeholder="e.g., Default View, Compact View">
              </div>
              <div class="form-group" style="margin: 0; display: flex; align-items: flex-end; gap: 12px;">
                <label class="form-check" style="padding: 0;">
                  <input type="checkbox" id="template-is-default" ${template?.is_default || !template ? 'checked' : ''}>
                  <span class="form-check-label">Default template</span>
                </label>
              </div>
            </div>
          </div>
          <div class="template-editor-panel">
            <div class="template-editor-left">
              <div class="template-editor-pane-head">
                <span>HTML Template</span>
                <span style="font-size: 10px; color: var(--ink-4); text-transform: none; letter-spacing: 0; font-weight: 400;">Use {{field_name}} placeholders</span>
              </div>
              <div class="template-field-chips">
                ${fields.map(f => `<span class="template-field-chip" onclick="insertFieldPlaceholder('${f.name}')" title="Click to insert">{{${f.name}}}</span>`).join('')}
              </div>
              <textarea class="template-code-area" id="template-html" spellcheck="false">${escapeHtml(defaultHtml)}</textarea>
              <div class="chat-panel">
                <div class="chat-panel-head">
                  <span>AI Template Designer</span>
                  <span style="font-size: 10px; color: var(--ink-4); text-transform: none; letter-spacing: 0; font-weight: 400;">Powered by Heurisk Agent</span>
                </div>
                <div class="chat-messages" id="template-chat-messages">
                  <div class="chat-msg system">Ask the agent to design a template. E.g. "Show key fields in a compact card layout"</div>
                </div>
                <div class="chat-input-row">
                  <input type="text" id="template-chat-input" placeholder="Describe how you want records displayed..." onkeydown="if(event.key==='Enter')sendTemplateChat('${entityId}')">
                  <button class="chat-send-btn" id="template-chat-send" onclick="sendTemplateChat('${entityId}')">Send</button>
                </div>
              </div>
            </div>
            <div class="template-editor-right">
              <div class="template-editor-pane-head">
                <span>Live Preview</span>
              </div>
              <div class="template-preview-area" id="template-preview">
                <div style="color: var(--ink-4); font-size: 12px; text-align: center; padding: 40px;">
                  Preview will appear here as you type
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="btn btn-primary" onclick="saveTemplate('${entityId}', '${editId || ''}')">${template ? 'Update' : 'Create'}</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Live preview on input
      const textarea = document.getElementById('template-html');
      textarea.addEventListener('input', () => updateTemplatePreview(entity, fields));
      updateTemplatePreview(entity, fields);
    }

    function generateDefaultTemplateHtml(entity, fields) {
      if (!entity || fields.length === 0) {
        return `<div class="record-card">
  <h2>{{name}}</h2>
  <p>No fields defined yet</p>
</div>`;
      }

      const keyFields = fields.slice(0, 6);
      const lines = keyFields.map(f =>
        `  <div class="field"><span class="label">${f.display_name || f.name}</span><span class="value">{{${f.name}}}</span></div>`
      ).join('\n');

      return `<div class="record-card">
  <div class="header">
    <h2>{{${fields[0]?.name || 'name'}}}</h2>
    <span class="badge">{{status}}</span>
  </div>
  <div class="fields">
${lines}
  </div>
</div>`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function insertFieldPlaceholder(fieldName) {
      const textarea = document.getElementById('template-html');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const placeholder = `{{${fieldName}}}`;
      textarea.value = text.substring(0, start) + placeholder + text.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + placeholder.length;
      textarea.focus();
      textarea.dispatchEvent(new Event('input'));
    }

    function updateTemplatePreview(entity, fields) {
      const html = document.getElementById('template-html').value;
      const preview = document.getElementById('template-preview');

      // Create sample data
      const sampleData = {};
      fields.forEach(f => {
        if (f.field_type === 'number') sampleData[f.name] = (Math.random() * 1000).toFixed(2);
        else if (f.field_type === 'boolean') sampleData[f.name] = Math.random() > 0.5 ? 'Yes' : 'No';
        else if (f.field_type === 'date') sampleData[f.name] = '2026-09-11';
        else sampleData[f.name] = `Sample ${f.display_name || f.name}`;
      });
      sampleData.id = 'rec-abc123';
      sampleData.status = 'Active';
      sampleData.name = entity?.display_name || 'Sample Record';

      // Replace placeholders
      let rendered = html.replace(/\{\{(\w+)\}\}/g, (match, key) => {
        return sampleData[key] !== undefined ? sampleData[key] : `<em style="color:var(--red);">[${key}]</em>`;
      });

      // Wrap in styled preview
      preview.innerHTML = `
        <style>
          .preview-record-card { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
          .preview-record-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
          .preview-record-card h2 { font-family: Georgia, serif; font-size: 18px; margin: 0; color: var(--ink); }
          .preview-record-card .badge { padding: 3px 10px; background: #e1f1e7; color: var(--green); font-size: 10px; font-weight: 600; text-transform: uppercase; }
          .preview-record-card .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
          .preview-record-card .field { display: flex; flex-direction: column; gap: 2px; }
          .preview-record-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); font-weight: 600; }
          .preview-record-card .value { font-size: 13px; color: var(--ink); }
        </style>
        <div class="preview-record-card">${rendered}</div>
      `;
    }

    async function previewTemplate() {
      const textarea = document.getElementById('template-html');
      textarea.dispatchEvent(new Event('input'));
    }

    async function sendTemplateChat(entityId) {
      const input = document.getElementById('template-chat-input');
      const sendBtn = document.getElementById('template-chat-send');
      const messages = document.getElementById('template-chat-messages');
      const textarea = document.getElementById('template-html');

      const prompt = input.value.trim();
      if (!prompt) return;

      // Add user message
      messages.innerHTML += `<div class="chat-msg user">${prompt}</div>`;
      input.value = '';
      sendBtn.disabled = true;
      sendBtn.textContent = '...';
      messages.scrollTop = messages.scrollHeight;

      // Build context for agent
      const schemaFields = records.SchemaField || [];
      const fields = schemaFields.filter(f => f.entity_id === entityId);
      const fieldList = fields.map(f => `${f.name} (${f.field_type || 'string'})`).join(', ');
      const currentHtml = textarea.value;

      const agentPrompt = `You are designing an HTML display template for a record. The entity has these fields: ${fieldList}.

Current template HTML:
${currentHtml}

User request: ${prompt}

Respond with ONLY the updated HTML template. Use {{field_name}} placeholders for field values. Keep the HTML clean and semantic. Do not include any explanation — just return the HTML.`;

      try {
        const response = await apiCallAgent('template-designer', agentPrompt, { entityId, fields: fieldList });
        // Extract HTML from response (strip markdown code blocks if present)
        let html = response.trim();
        const codeBlockMatch = html.match(/```(?:html)?\s*([\s\S]*?)```/);
        if (codeBlockMatch) html = codeBlockMatch[1].trim();

        textarea.value = html;
        textarea.dispatchEvent(new Event('input'));

        messages.innerHTML += `<div class="chat-msg agent">Template updated. Check the preview →</div>`;
      } catch (err) {
        messages.innerHTML += `<div class="chat-msg agent" style="color: var(--red);">Agent unavailable: ${err.message}. Try describing your template manually using the field chips above.</div>`;
      }

      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      messages.scrollTop = messages.scrollHeight;
    }

    async function saveTemplate(entityId, editId) {
      const name = document.getElementById('template-name').value.trim();
      const htmlContent = document.getElementById('template-html').value;
      const isDefault = document.getElementById('template-is-default').checked;

      if (!name) {
        alert('Template name is required');
        return;
      }

      const templates = records.EntityTemplate || [];
      const existing = editId ? templates.find(t => t.id === editId) : null;

      // Get field order from placeholders
      const placeholders = [...htmlContent.matchAll(/\{\{(\w+)\}\}/g)].map(m => m[1]);
      const fieldOrder = [...new Set(placeholders)].join(',');

      const data = {
        entity_id: entityId,
        name,
        html_content: htmlContent,
        field_order: fieldOrder,
        is_default: isDefault,
        version: (existing?.version || 0) + 1,
        updated_at: new Date().toISOString()
      };

      try {
        // If setting as default, unset other defaults
        if (isDefault) {
          const otherDefaults = templates.filter(t => t.entity_id === entityId && t.is_default && t.id !== editId);
          for (const other of otherDefaults) {
            await apiUpdateRecord('EntityTemplate', other.id, { is_default: false });
          }
        }

        if (editId) {
          data.created_at = existing.created_at;
          await apiUpdateRecord('EntityTemplate', editId, data);
        } else {
          data.created_at = new Date().toISOString();
          await apiCreateRecord('EntityTemplate', data);
        }
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to save template: ' + err.message);
      }
    }

    async function deleteTemplate(templateId) {
      if (!confirm('Delete this template?')) return;
      try {
        await apiDeleteRecord('EntityTemplate', templateId);
        render();
      } catch (err) {
        alert('Failed to delete template: ' + err.message);
      }
    }

    // ===== Unified Grid View =====
    function renderUnifiedGrid() {
      const schemaEntities = records.SchemaEntity || [];
      const selectedEntity = state.gridEntity || 'all';
      const selectedDate = state.gridDate || '';
      const searchText = state.gridSearch || '';

      // Collect all records across entities
      let allRows = [];
      const entityNames = selectedEntity === 'all'
        ? Object.keys(records).filter(k => !['SchemaEntity','SchemaField','SchemaRelationship','ExpressionColumn','StandardizedList','FieldListBinding','LinkType','RecordLink','EntityTemplate','PrecedenceRule','DQException','DataSource','FieldLineage'].includes(k))
        : [selectedEntity];

      for (const entityName of entityNames) {
        const recs = records[entityName] || [];
        for (const rec of recs) {
          // Get knowledge date from various possible fields
          const knowledgeDate = rec.knowledge_date || rec.valid_from || rec.reporting_date || rec.as_of_date || rec.date || '';
          const systemDate = rec.system_date || rec.created_at || rec.updated_at || '';
          const name = rec.name || rec.legal_name || rec.display_name || rec.title || rec.id?.substring(0, 8) || '—';
          const status = rec.status || 'active';

          allRows.push({
            entityName,
            record: rec,
            knowledgeDate,
            systemDate,
            name,
            status
          });
        }
      }

      // Filter by date
      if (selectedDate) {
        allRows = allRows.filter(r => {
          if (!r.knowledgeDate) return false;
          const kd = r.knowledgeDate.substring(0, 10); // YYYY-MM-DD
          return kd === selectedDate || kd <= selectedDate;
        });
      }

      // Filter by search
      if (searchText) {
        const q = searchText.toLowerCase();
        allRows = allRows.filter(r =>
          r.name.toLowerCase().includes(q) ||
          r.entityName.toLowerCase().includes(q) ||
          r.record.id?.toLowerCase().includes(q)
        );
      }

      // Sort by knowledge date desc
      allRows.sort((a, b) => (b.knowledgeDate || '').localeCompare(a.knowledgeDate || ''));

      const entityColors = {
        Fund: 'var(--accent)',
        Issuer: 'var(--accent-2)',
        Security: 'var(--gold)',
        Position: 'var(--green)',
      };

      return `
        <div class="view-fade">
          <div class="crumbs">
            <span class="crumb-link" onclick="go('landing')">Home</span>
            <span class="sep">›</span>
            <span class="crumb-current">Data Grid</span>
          </div>

          <div class="page-header">
            <div>
              <div class="page-title">Unified Data Grid</div>
              <div class="page-meta">All entities · filterable by knowledge date</div>
            </div>
            <div class="page-actions">
              <button class="btn">Export CSV</button>
            </div>
          </div>

          <div class="grid-toolbar">
            <div class="grid-toolbar-label">Entity</div>
            <select class="grid-entity-select" onchange="state.gridEntity = this.value; render()">
              <option value="all" ${selectedEntity === 'all' ? 'selected' : ''}>All Entities</option>
              ${entityNames.map(n => `<option value="${n}" ${selectedEntity === n ? 'selected' : ''}>${n}</option>`).join('')}
            </select>

            <div class="grid-toolbar-label" style="margin-left: 12px;">Knowledge Date</div>
            <input type="date" class="grid-date-input" value="${selectedDate}" onchange="state.gridDate = this.value; render()">
            ${selectedDate ? `<button class="btn btn-sm" onclick="state.gridDate = ''; render();">Clear Date</button>` : ''}

            <input type="text" class="grid-search-input" placeholder="Search records..." value="${searchText}" oninput="state.gridSearch = this.value; render()">

            <div class="grid-count">Showing <strong>${allRows.length}</strong> records</div>
          </div>

          <div class="unified-grid-table">
            <div class="ug-head" style="grid-template-columns: 110px 1.5fr 130px 130px 90px 1fr 80px;">
              <div>Entity</div>
              <div>Name</div>
              <div>Knowledge Date</div>
              <div>System Date</div>
              <div>Status</div>
              <div>ID</div>
              <div style="text-align: right;">Action</div>
            </div>
            ${allRows.length > 0 ? allRows.slice(0, 200).map(r => `
              <div class="ug-row" style="grid-template-columns: 110px 1.5fr 130px 130px 90px 1fr 80px;">
                <div>
                  <span class="ug-entity-badge" style="border-color: ${entityColors[r.entityName] || 'var(--ink-4)'}; color: ${entityColors[r.entityName] || 'var(--ink-3)'};">${r.entityName}</span>
                </div>
                <div style="font-weight: 500; color: var(--ink);">${r.name}</div>
                <div class="ug-date-cell">${r.knowledgeDate ? r.knowledgeDate.substring(0, 10) : '—'}</div>
                <div class="ug-date-cell">${r.systemDate ? r.systemDate.substring(0, 10) : '—'}</div>
                <div><span class="status-chip active" style="font-size: 9px;">● ${r.status}</span></div>
                <div class="row-id">${r.record.id?.substring(0, 12) || '—'}</div>
                <div style="text-align: right;">
                  <button class="field-action-btn" onclick="go('record-detail', {entity: '${r.entityName}', recordId: '${r.record.id}'})">View</button>
                </div>
              </div>
            `).join('') : `
              <div style="padding: 60px 28px; text-align: center; color: var(--ink-3); grid-column: 1 / -1;">
                <div style="font-size: 36px; margin-bottom: 12px;">📊</div>
                <div style="font-size: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px;">No records found</div>
                <div style="font-size: 12px;">Try adjusting your filters or adding data through the Heurisk platform.</div>
              </div>
            `}
          </div>
        </div>
      `;
    }
  </script>
</body>
