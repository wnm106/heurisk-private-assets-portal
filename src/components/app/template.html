<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian MDM — Master Data Management</title>

<style>
:root {
    --bg: #f7f6f3;
    --bg-alt: #efece6;
    --surface: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #2a2a28;
    --ink-3: #5a5a55;
    --ink-4: #9a9a93;
    --line: #e6e3dc;
    --line-strong: #c9c5bb;
    --accent: #b8531a;
    --accent-2: #1b3a4b;
    --gold: #c89c3f;
    --green: #2f7d4f;
    --red: #b53030;
    --amber: #c98a0c;
    --src-bloomberg: #c2410c;
    --src-wso: #6d28d9;
    --src-dealcloud: #0369a1;
    --src-allvue: #047857;
    --src-spciq: #be185d;
    --src-manual: #b45309;
    --src-derived: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { min-height: 100vh; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .mono { font-family: 'Courier New', monospace; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  .topbar {
    background: var(--ink);
    color: var(--bg);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #000;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 32px; height: 32px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 18px;
  }
  .brand-text {
    font-family: Georgia, serif;
    font-weight: 600;
    font-size: 16px;
  }
  .brand-sub {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a8a85;
    padding-left: 14px;
    border-left: 1px solid #2a2a28;
    margin-left: 4px;
  }
  .role-tabs { display: flex; margin-left: 32px; border: 1px solid #2a2a28; }
  .role-tab {
    background: transparent;
    color: #8a8a85;
    border: none;
    padding: 7px 16px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-right: 1px solid #2a2a28;
  }
  .role-tab:last-child { border-right: none; }
  .role-tab.active { background: var(--accent); color: #fff; }
  .role-tab:hover:not(.active) { color: #fff; background: #1a1a17; }
  .topbar-right { display: flex; align-items: center; gap: 20px; font-size: 11px; }
  .status-pill { display: flex; align-items: center; gap: 6px; color: #8a8a85; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
  .status-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
  .avatar {
    width: 28px; height: 28px;
    background: #2a2a28;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  .legend {
    background: var(--surface);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    border-bottom: 1px solid var(--line);
  }
  .legend-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-2); font-weight: 500; }
  .legend-swatch { width: 3px; height: 14px; }

  .main { padding: 28px; max-width: 1640px; margin: 0 auto; }

  .crumbs { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--ink-3); margin-bottom: 22px; text-transform: uppercase; letter-spacing: 1px; }
  .crumb-link { color: var(--accent); cursor: pointer; font-weight: 500; }
  .crumb-link:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--ink-4); }
  .crumb-current { color: var(--ink); font-weight: 500; }

  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 32px 36px;
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    right: -80px; top: -60px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(184, 83, 26, 0.08) 0%, transparent 70%);
  }
  .hero-eyebrow { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2.5px; color: var(--accent); margin-bottom: 10px; }
  .hero-title { font-family: Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.2; letter-spacing: -0.3px; color: var(--ink); margin-bottom: 8px; }
  .hero-title em { color: var(--accent); font-style: italic; font-weight: 600; }
  .hero-sub { font-size: 13px; color: var(--ink-3); max-width: 540px; line-height: 1.55; }
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line-strong); padding: 11px 16px; min-width: 340px; z-index: 1; }
  .search-box input { border: none; outline: none; background: transparent; font-size: 13px; flex: 1; color: var(--ink); }
  .search-box input::placeholder { color: var(--ink-4); }
  .kbd { font-family: 'Courier New', monospace; font-size: 10px; padding: 3px 7px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); }

  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 28px; border: 1px solid var(--line); background: var(--surface); }
  .stat { padding: 20px 24px; border-right: 1px solid var(--line); position: relative; }
  .stat:last-child { border-right: none; }
  .stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); margin-bottom: 12px; }
  .stat-val { font-family: Georgia, serif; font-size: 32px; font-weight: 500; color: var(--ink); line-height: 1; margin-bottom: 6px; letter-spacing: -0.5px; }
  .stat-val sup { font-size: 16px; color: var(--ink-3); margin-left: 2px; }
  .stat-sub { font-size: 11px; color: var(--ink-3); }
  .stat-sub .up { color: var(--green); font-weight: 600; }
  .stat-sub .down { color: var(--red); font-weight: 600; }
  .stat-sub .warn { color: var(--amber); font-weight: 600; }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .section-title h2 { font-family: Georgia, serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink); }
  .section-title .hint { font-size: 11px; color: var(--ink-3); font-style: italic; }

  .entity-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 32px; }
  .entity-card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 22px;
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
  }
  .entity-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: var(--card-accent, var(--accent));
    transform: scaleX(0.3);
    transform-origin: left;
    transition: transform 0.25s ease;
  }
  .entity-card:hover { border-color: var(--ink-4); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(10, 10, 10, 0.06); }
  .entity-card:hover::before { transform: scaleX(1); }
  .entity-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .entity-icon { font-family: Georgia, serif; font-size: 36px; font-weight: 500; color: var(--card-accent, var(--accent)); line-height: 1; letter-spacing: -2px; }
  .entity-count { text-align: right; }
  .entity-count .num { font-family: Georgia, serif; font-size: 22px; font-weight: 500; color: var(--ink); letter-spacing: -0.5px; }
  .entity-count .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); }
  .entity-name { font-family: Georgia, serif; font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 6px; letter-spacing: -0.2px; }
  .entity-desc { font-size: 12px; color: var(--ink-3); line-height: 1.5; margin-bottom: 16px; min-height: 34px; }
  .entity-sources { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
  .src-tag { font-size: 9px; padding: 3px 7px; background: var(--bg); color: var(--ink-2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.7px; border: 1px solid var(--line); }
  .entity-footer { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 14px; border-top: 1px solid var(--line); }
  .entity-quality .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-3); margin-bottom: 4px; }
  .entity-quality .val { font-family: Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1; }
  .entity-quality .delta { font-size: 11px; margin-left: 4px; font-weight: 500; }

  .nav-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .nav-card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 22px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 16px;
    align-items: center;
  }
  .nav-card:hover { border-color: var(--ink-4); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(10, 10, 10, 0.06); }
  .nav-icon { width: 44px; height: 44px; background: var(--bg); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .nav-title { font-family: Georgia, serif; font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .nav-desc { font-size: 12px; color: var(--ink-3); }

  .page-header { background: var(--surface); border: 1px solid var(--line); padding: 22px 28px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .page-title-block { display: flex; align-items: center; gap: 18px; }
  .page-icon { width: 56px; height: 56px; background: var(--bg); color: var(--card-accent, var(--accent)); display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 36px; font-weight: 500; border: 1px solid var(--line); }
  .page-title { font-family: Georgia, serif; font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; margin-bottom: 4px; }
  .page-meta { font-size: 12px; color: var(--ink-3); }
  .page-actions { display: flex; gap: 8px; }
  .btn { padding: 9px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); transition: all 0.15s; }
  .btn:hover { background: var(--bg); border-color: var(--ink-4); }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn-sm { padding: 5px 11px; font-size: 10px; letter-spacing: 0.7px; }

  .filter-bar { background: var(--surface); border: 1px solid var(--line); padding: 12px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); }
  .filter-pill { padding: 5px 11px; background: var(--bg); font-size: 11px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer; border: 1px solid var(--line); }
  .filter-pill.active { background: #fef6e8; border-color: var(--amber); color: #92400e; }
  .filter-pill .x { color: var(--ink-4); font-size: 12px; }
  .filter-count { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .filter-count strong { color: var(--ink); font-weight: 600; }

  .data-table { background: var(--surface); border: 1px solid var(--line); }
  .tbl-head { display: grid; grid-template-columns: 130px 1.6fr 130px 1fr 70px 120px 130px 90px 100px; gap: 14px; padding: 12px 18px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-3); }
  .tbl-row { display: grid; grid-template-columns: 130px 1.6fr 130px 1fr 70px 120px 130px 90px 100px; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 12px; align-items: center; cursor: pointer; transition: background 0.1s; }
  .tbl-row:last-child { border-bottom: none; }
  .tbl-row:hover { background: var(--bg); }
  .row-id { font-family: 'Courier New', monospace; color: var(--accent); font-weight: 500; font-size: 11px; }
  .row-name { color: var(--ink); font-weight: 500; }
  .type-chip { font-size: 10px; padding: 3px 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; }
  .type-chip.loan { background: #f3eafd; color: #6d28d9; }
  .type-chip.bond { background: #fde9d7; color: #c2410c; }
  .row-num { font-family: 'Courier New', monospace; font-weight: 500; text-align: right; }
  .src-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
  .src-badge .dot { width: 5px; height: 5px; border-radius: 50%; }
  .conflicts-cell { text-align: center; }
  .conflict-num { display: inline-block; padding: 2px 9px; background: #fdecec; color: var(--red); font-weight: 600; font-size: 11px; font-family: 'Courier New', monospace; }
  .check { color: var(--green); font-weight: 700; }
  .quality-cell { display: inline-flex; align-items: center; gap: 6px; font-family: 'Courier New', monospace; font-weight: 600; }
  .trend-up { color: var(--green); }
  .trend-down { color: var(--red); }
  .trend-flat { color: var(--ink-4); }

  .record-header { background: var(--surface); border: 1px solid var(--line); padding: 24px 28px; margin-bottom: 18px; }
  .record-meta-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rec-id { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 600; color: var(--accent); }
  .status-chip { font-size: 10px; padding: 3px 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
  .status-chip.active { background: #e1f1e7; color: var(--green); }
  .status-chip.conflict { background: #fdf0d7; color: #92400e; }
  .rec-time { font-size: 11px; color: var(--ink-3); }
  .record-name { font-family: Georgia, serif; font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -0.3px; margin-bottom: 4px; }
  .record-tag { font-size: 12px; color: var(--ink-3); }
  .record-header-right { display: flex; align-items: center; gap: 24px; }
  .score-block { text-align: center; }
  .score-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); margin-bottom: 6px; }
  .score-val { font-family: Georgia, serif; font-size: 38px; font-weight: 500; line-height: 1; letter-spacing: -1px; }
  .record-actions { display: flex; flex-direction: column; gap: 7px; }

  .detail-layout { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: flex-start; }

  .field-section { background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; overflow: hidden; }
  .field-section-head { padding: 13px 20px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .field-section-name { font-family: Georgia, serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink); }
  .field-section-count { font-size: 11px; color: var(--ink-3); font-family: 'Courier New', monospace; }
  .field-row { display: grid; grid-template-columns: 220px 1fr 130px; gap: 18px; padding: 12px 20px 12px 16px; border-bottom: 1px solid var(--line); align-items: center; border-left: 4px solid var(--field-color, var(--ink-4)); transition: background 0.1s; }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: var(--bg); }
  .field-label { font-size: 12px; color: var(--ink-3); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .field-value-cell { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field-value { font-size: 13px; color: var(--ink); font-weight: 400; }
  .field-value.conflict { font-weight: 600; }
  .conflict-badge { font-size: 9px; padding: 2px 7px; background: #fdecec; color: var(--red); font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; }
  .field-src-cell { display: flex; justify-content: flex-end; }

  .rail-card { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 14px; }
  .rail-card.alert { border-color: #f3c8c8; background: #fef9f9; }
  .rail-head { font-family: Georgia, serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .rail-head.alert { color: var(--red); }
  .rail-count { margin-left: auto; background: #fdecec; color: var(--red); padding: 2px 8px; font-size: 10px; font-family: 'Courier New', monospace; font-weight: 600; }

  .src-contribution { margin-bottom: 10px; }
  .src-contribution:last-child { margin-bottom: 0; }
  .src-c-head { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .src-c-name { color: var(--ink-2); font-weight: 500; }
  .src-c-detail { color: var(--ink-3); font-family: 'Courier New', monospace; font-size: 10px; }
  .src-c-bar { height: 4px; background: var(--bg-alt); overflow: hidden; }
  .src-c-bar > div { height: 100%; }

  .conflict-item { padding: 10px 12px; background: #fef0f0; border-left: 3px solid var(--red); margin-bottom: 8px; font-size: 11px; }
  .conflict-item:last-child { margin-bottom: 0; }
  .conflict-item .ttl { font-weight: 600; color: #7f1d1d; margin-bottom: 3px; }
  .conflict-item .det { color: #991b1b; line-height: 1.5; }

  .activity-item { display: flex; gap: 12px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .activity-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .act-avatar { width: 26px; height: 26px; background: var(--bg-alt); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .act-txt { font-size: 11px; color: var(--ink); line-height: 1.5; }
  .act-time { font-size: 10px; color: var(--ink-4); margin-top: 2px; font-family: 'Courier New', monospace; }

  .rule-card { background: var(--surface); border: 1px solid var(--line); padding: 18px 22px; margin-bottom: 12px; }
  .rule-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .rule-field-name { font-family: Georgia, serif; font-size: 16px; font-weight: 600; color: var(--ink); }
  .std-pill { font-size: 9px; padding: 3px 8px; background: #e8eef2; color: var(--accent-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-left: 10px; }
  .rule-cond { padding: 11px 16px; background: var(--bg); margin-bottom: 12px; font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-2); border-left: 3px solid var(--accent); }
  .rule-cond .kw { color: var(--accent); font-weight: 600; }
  .rule-chain { display: flex; align-items: center; gap: 8px; }
  .rule-chain-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); }
  .arrow { color: var(--ink-4); font-size: 14px; line-height: 1; }
  .rule-note { margin-left: auto; font-size: 11px; color: var(--ink-3); font-style: italic; }
  .rule-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .rule-tab { padding: 8px 16px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-strong); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
  .rule-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .pillar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .pillar { background: var(--surface); border: 1px solid var(--line); padding: 24px 26px; border-top: 3px solid var(--pillar-color); position: relative; overflow: hidden; }
  .pillar-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; color: var(--ink-3); margin-bottom: 14px; }
  .pillar-val { font-family: Georgia, serif; font-size: 44px; font-weight: 500; color: var(--ink); line-height: 1; letter-spacing: -1px; margin-bottom: 8px; }
  .pillar-sub { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .pillar-det { font-size: 11px; color: var(--ink-3); }

  .quality-matrix { background: var(--surface); border: 1px solid var(--line); margin-bottom: 18px; overflow: hidden; }
  .qm-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .qm-title { font-family: Georgia, serif; font-size: 15px; font-weight: 600; color: var(--ink); }
  .qm-window { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; }
  .qm-thead { display: grid; grid-template-columns: 180px 1fr 1fr 130px 110px 90px; gap: 18px; padding: 10px 22px; background: var(--bg); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-3); }
  .qm-row { display: grid; grid-template-columns: 180px 1fr 1fr 130px 110px 90px; gap: 18px; padding: 16px 22px; border-bottom: 1px solid var(--line); font-size: 12px; align-items: center; }
  .qm-row:last-child { border-bottom: none; }
  .qm-ent { font-weight: 600; color: var(--ink); font-family: Georgia, serif; font-size: 14px; }
  .qm-bar-wrap { display: flex; align-items: center; gap: 12px; }
  .qm-bar { flex: 1; height: 5px; background: var(--bg-alt); overflow: hidden; }
  .qm-bar > div { height: 100%; }
  .qm-pct { font-family: 'Courier New', monospace; font-weight: 600; color: var(--ink); min-width: 38px; font-size: 12px; }
  .qm-traj { font-family: 'Courier New', monospace; font-weight: 600; font-size: 12px; }
  .qm-exc { text-align: right; font-family: 'Courier New', monospace; }
  .qm-spark { text-align: right; }

  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bottom-card { background: var(--surface); border: 1px solid var(--line); padding: 20px 24px; }
  .bottom-title { font-family: Georgia, serif; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
  .exc-item, .src-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .exc-item:last-child, .src-item:last-child { border-bottom: none; }
  .sev-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 9px; }
  .sev-high { background: var(--red); }
  .sev-med { background: var(--amber); }
  .exc-rule { color: var(--ink-2); }
  .exc-count { font-family: 'Courier New', monospace; font-weight: 600; color: var(--ink); }
  .src-item-name { font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
  .src-item-bar { width: 4px; height: 16px; }
  .src-item-vals { display: flex; align-items: center; gap: 14px; }
  .src-item-delta { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 500; }
  .src-item-score { font-family: 'Courier New', monospace; font-weight: 600; color: var(--ink); }

  .src-bg-bloomberg { background: var(--src-bloomberg); }
  .src-bg-wso { background: var(--src-wso); }
  .src-bg-dealcloud { background: var(--src-dealcloud); }
  .src-bg-allvue { background: var(--src-allvue); }
  .src-bg-spciq { background: var(--src-spciq); }
  .src-bg-manual { background: var(--src-manual); }
  .src-bg-derived { background: var(--src-derived); }

  .view-fade { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .view { display: none; }
  .view.active { display: block; }

  /* ===== Schema Builder ===== */
  .schema-canvas {
    background: var(--surface);
    border: 1px solid var(--line);
    min-height: 600px;
    position: relative;
    overflow: hidden;
    padding: 28px;
  }
  .schema-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    position: relative;
  }
  .schema-entity-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--card-accent, var(--accent));
    cursor: pointer;
    transition: all 0.18s ease;
    position: relative;
  }
  .schema-entity-card:hover {
    border-color: var(--ink-4);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(10,10,10,0.06);
  }
  .schema-entity-card.date-dim {
    border-top-color: var(--gold);
  }
  .schema-entity-head {
    padding: 16px 18px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--line);
  }
  .schema-entity-title {
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .schema-entity-role {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .role-fact { background: #e8eef2; color: var(--accent-2); }
  .role-dimension { background: #f3eafd; color: #6d28d9; }
  .role-bridge { background: #fef3c7; color: #92400e; }
  .role-date-dim { background: #fef3c7; color: var(--gold); }
  .schema-entity-fields {
    padding: 8px 0;
  }
  .schema-field-item {
    padding: 6px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .schema-field-item:hover { background: var(--bg); }
  .schema-field-icon {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-4);
    flex-shrink: 0;
  }
  .schema-field-icon.pk { color: var(--accent); }
  .schema-field-icon.fk { color: var(--accent-2); }
  .schema-field-name { flex: 1; }
  .schema-field-type {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--ink-4);
  }
  .schema-entity-footer {
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-3);
  }
  .schema-date-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 8px;
    background: #fef3c7;
    color: #92400e;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .schema-add-card {
    background: var(--bg);
    border: 2px dashed var(--line-strong);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    cursor: pointer;
    transition: all 0.18s ease;
    color: var(--ink-3);
  }
  .schema-add-card:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #fef6e8;
  }
  .schema-add-icon {
    font-size: 32px;
    margin-bottom: 8px;
    line-height: 1;
  }
  .schema-add-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Relationship lines */
  .schema-rel-line {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .schema-rel-label {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 2px 8px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-3);
    z-index: 1;
    pointer-events: none;
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,10,0.5);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .modal-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    width: 90%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(10,10,10,0.15);
  }
  .modal-head {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-4);
    cursor: pointer;
    padding: 4px 8px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body {
    padding: 24px;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 72px; }
  .form-group .hint {
    font-size: 11px;
    color: var(--ink-4);
    margin-top: 4px;
  }
  .form-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    cursor: pointer;
  }
  .form-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .form-check-label {
    font-size: 13px;
    color: var(--ink-2);
  }
  .form-check-desc {
    font-size: 11px;
    color: var(--ink-4);
    margin-left: auto;
  }

  /* Parent entity picker */
  .parent-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .parent-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.12s;
  }
  .parent-chip:hover { border-color: var(--accent); }
  .parent-chip.selected {
    background: #e8eef2;
    border-color: var(--accent-2);
    color: var(--accent-2);
    font-weight: 600;
  }
  .parent-chip .x {
    font-size: 12px;
    color: var(--ink-4);
    margin-left: 2px;
  }

  /* Date granularity selector */
  .date-gran-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 6px;
  }
  .date-gran-option {
    padding: 10px 8px;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.12s;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
  }
  .date-gran-option:hover { border-color: var(--accent); color: var(--ink-2); }
  .date-gran-option.selected {
    background: #fef3c7;
    border-color: var(--gold);
    color: #92400e;
    font-weight: 600;
  }
  .date-gran-icon {
    font-size: 18px;
    margin-bottom: 4px;
    display: block;
  }

  /* Entity detail view */
  .entity-detail-header {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 24px 28px;
    margin-bottom: 18px;
  }
  .entity-detail-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .entity-detail-name {
    font-family: Georgia, serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .entity-detail-desc {
    font-size: 13px;
    color: var(--ink-3);
    max-width: 600px;
    line-height: 1.5;
  }
  .entity-detail-stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .entity-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .entity-stat-val {
    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
  }
  .entity-stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-3);
  }

  /* Field table */
  .field-table { background: var(--surface); border: 1px solid var(--line); }
  .field-table-head {
    display: grid;
    grid-template-columns: 32px 1.2fr 100px 80px 60px 60px 140px 80px;
    gap: 12px;
    padding: 10px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-3);
    align-items: center;
  }
  .field-table-row {
    display: grid;
    grid-template-columns: 32px 1.2fr 100px 80px 60px 60px 140px 80px;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    align-items: center;
    transition: background 0.1s;
  }
  .field-table-row:last-child { border-bottom: none; }
  .field-table-row:hover { background: var(--bg); }
  .field-order {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--ink-4);
    text-align: center;
  }
  .field-name-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .field-name-main {
    font-weight: 500;
    color: var(--ink);
  }
  .field-name-display {
    font-size: 11px;
    color: var(--ink-4);
  }
  .field-type-cell {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
  .field-bool-cell {
    text-align: center;
    font-size: 14px;
  }
  .field-bool-cell.yes { color: var(--green); font-weight: 700; }
  .field-bool-cell.no { color: var(--ink-4); }
  .field-actions-cell {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }
  .field-action-btn {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--ink-4);
    cursor: pointer;
    padding: 3px 6px;
  }
  .field-action-btn:hover { color: var(--accent); }
  .field-action-btn.delete:hover { color: var(--red); }

  /* Relationship pills */
  .rel-section {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 22px;
    margin-bottom: 14px;
  }
  .rel-section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .rel-section-title {
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink);
  }
  .rel-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    margin-right: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .rel-pill-arrow { color: var(--accent); font-weight: 700; }
  .rel-pill-cardinality {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--ink-4);
  }

  /* Expression Columns */
  .expr-section {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 22px;
    margin-bottom: 14px;
  }
  .expr-section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .expr-section-title {
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink);
  }
  .expr-card {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .expr-card:last-child { margin-bottom: 0; }
  .expr-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .expr-name {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .expr-type {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    padding: 2px 8px;
    background: var(--surface);
    color: var(--ink-3);
    border: 1px solid var(--line);
  }
  .expr-formula {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--accent-2);
    background: var(--surface);
    padding: 8px 12px;
    border-left: 3px solid var(--accent);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .expr-deps {
    font-size: 11px;
    color: var(--ink-3);
  }
  .expr-deps-label {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 6px;
  }
  .expr-dep-chip {
    display: inline-block;
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    margin-right: 4px;
    color: var(--ink-2);
  }

  /* Standardized Lists */
  .list-card {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 18px 22px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .list-card:hover {
    border-color: var(--ink-4);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(10,10,10,0.06);
  }
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .list-name {
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .list-count {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink-3);
  }
  .list-desc {
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .list-values-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .list-value-chip {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11px;
    font-family: 'Courier New', monospace;
    color: var(--ink-2);
  }
  .list-value-more {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11px;
    color: var(--ink-4);
  }

  /* List Detail View */
  .list-detail-header {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 24px 28px;
    margin-bottom: 18px;
  }
  .list-detail-name {
    font-family: Georgia, serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .list-detail-desc {
    font-size: 13px;
    color: var(--ink-3);
    max-width: 600px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .list-detail-stats {
    display: flex;
    gap: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .list-values-table {
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .list-values-head {
    display: grid;
    grid-template-columns: 60px 1fr 200px 100px;
    gap: 12px;
    padding: 10px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-3);
  }
  .list-values-row {
    display: grid;
    grid-template-columns: 60px 1fr 200px 100px;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    align-items: center;
  }
  .list-values-row:last-child { border-bottom: none; }
  .list-value-index {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--ink-4);
    text-align: center;
  }
  .list-value-main {
    font-family: 'Courier New', monospace;
    font-weight: 500;
    color: var(--ink);
  }
  .list-value-label {
    font-size: 11px;
    color: var(--ink-3);
  }

  /* Field binding indicator */
  .field-list-badge {
    display: inline-flex;
    align-items: center;

  /* ===== Template Editor ===== */
  .template-section {
    background: var(--surface);

  }

    padding: 13px 20px;

    padding: 14px 20px;

  /* Template editor modal */
  .template-editor-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 500px;
    border-top: 1px solid var(--line);
  }
  .template-editor-left {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }
  .template-editor-right {
    display: flex;
    flex-direction: column;
  }
  .template-editor-pane-head {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .template-code-area {
    flex: 1;
    padding: 0;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Courier New', monospace;

  .template-preview-area {
    flex: 1;

    padding: 16px;
    background: var(--bg);

  }
  .template-field-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .template-field-chip {
    padding: 3px 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: var(--accent-2);
    cursor: pointer;
    transition: all 0.12s;
  }
  .template-field-chip:hover {
    border-color: var(--accent);
    background: #fef6e8;
  }

  /* Chat panel for template design */
  .chat-panel {
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    max-height: 300px;
  }
  .chat-panel-head {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 120px;
  }
  .chat-msg {
    max-width: 85%;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    border-radius: 8px;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: var(--ink);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .chat-msg.agent {
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-2);
    border-bottom-left-radius: 2px;
  }
  .chat-msg.system {
    align-self: center;
    background: transparent;
    color: var(--ink-4);
    font-size: 11px;
    font-style: italic;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .chat-input-row input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    outline: none;
  }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-send-btn {
    padding: 8px 14px;
    background: var(--ink);
    color: #fff;
    border: none;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    cursor: pointer;
  }
  .chat-send-btn:hover { background: var(--accent); }
  .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Full-width template editor modal */
  .modal-panel-wide {
    background: var(--surface);
    border: 1px solid var(--line);
    width: 90%;
    max-width: 1100px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(10,10,10,0.15);
  }

  /* ===== Unified Grid View ===== */
  .grid-toolbar {
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 12px 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .grid-toolbar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-3);
  }
  .grid-date-input {
    padding: 7px 12px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    font-family: 'Courier New', monospace;
    color: var(--ink);
    outline: none;
    background: var(--surface);
  }
  .grid-date-input:focus { border-color: var(--accent); }
  .grid-entity-select {
    padding: 7px 12px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    color: var(--ink);
    outline: none;
    background: var(--surface);
  }
  .grid-entity-select:focus { border-color: var(--accent); }
  .grid-search-input {
    padding: 7px 12px;
    border: 1px solid var(--line-strong);
    font-size: 12px;
    color: var(--ink);
    outline: none;

    min-width: 200px;
  }
  .grid-search-input:focus { border-color: var(--accent); }
  .grid-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
  }
  .grid-count strong { color: var(--ink); font-weight: 600; }

  .unified-grid-table {
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .ug-head {
    display: grid;
    gap: 14px;
    padding: 12px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-3);
    align-items: center;
  }
  .ug-row {
    display: grid;
    gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    align-items: center;
    cursor: pointer;
    transition: background 0.1s;
  }
  .ug-row:last-child { border-bottom: none; }
  .ug-row:hover { background: var(--bg); }
  .ug-entity-badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    border: 1px solid;
  }
  .ug-date-cell {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-text">Meridian</div>
      <div class="brand-sub">Master Data Management</div>
      <div class="role-tabs">
        <button class="role-tab active">Steward</button>
        <button class="role-tab">Ops</button>
        <button class="role-tab">Governance</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>All systems operational</span>
      </div>
      <div class="avatar">JD</div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-label">Data Sources</div>
    <div class="legend-item"><span class="legend-swatch src-bg-bloomberg"></span>Bloomberg</div>
    <div class="legend-item"><span class="legend-swatch src-bg-wso"></span>WSO</div>
    <div class="legend-item"><span class="legend-swatch src-bg-dealcloud"></span>DealCloud</div>
    <div class="legend-item"><span class="legend-swatch src-bg-allvue"></span>Allvue</div>
    <div class="legend-item"><span class="legend-swatch src-bg-spciq"></span>S&P Capital IQ</div>
    <div class="legend-item"><span class="legend-swatch src-bg-manual"></span>Manual</div>
    <div class="legend-item"><span class="legend-swatch src-bg-derived"></span>Derived</div>
    <div class="legend-sync">Last sync: <strong>2 min ago</strong></div>
  </div>

  <div class="main" id="app"></div>
<script>
    let entities = {};
    let records = {};
    let state = { view: 'landing', entity: null, recordId: null, expandedField: null, gridEntity: 'all', gridDate: '', gridSearch: '' };

    const sources = {
      bloomberg: { name: 'Bloomberg', hex: 'var(--src-bloomberg)' },
      wso: { name: 'WSO', hex: 'var(--src-wso)' },
      dealcloud: { name: 'DealCloud', hex: 'var(--src-dealcloud)' },
      allvue: { name: 'Allvue', hex: 'var(--src-allvue)' },
      spciq: { name: 'S&P Capital IQ', hex: 'var(--src-spciq)' },
      manual: { name: 'Manual', hex: 'var(--src-manual)' },
      derived: { name: 'Derived', hex: 'var(--src-derived)' }
    };

    // Render empty state when no data is available
    function renderEmptyState() {
      return `
        <div class="view-fade">
          <div class="crumbs">
            <span class="crumb-current">Home</span>
          </div>
          <div class="page-header">
            <div class="page-title-block">
              <div style="width: 4px; height: 48px; background: var(--accent);"></div>
              <div>
                <div class="page-title">Welcome to Meridian MDM</div>
                <div class="page-meta">Financial Master Data Management Platform</div>
              </div>
            </div>
          </div>
          <div style="padding: 60px 28px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
            <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--ink-2);">No Data Available</div>
            <div style="color: var(--ink-3); max-width: 500px; margin: 0 auto 24px; line-height: 1.6;">
              This application is ready to manage your financial master data. 
              To get started, design your schema or browse the data grid.
            </div>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
              <button class="btn btn-primary" onclick="go('schema-builder')">Open Schema Builder</button>
              <button class="btn" onclick="go('grid-view')">View Data Grid</button>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Render empty state immediately
      document.getElementById('app').innerHTML = renderEmptyState();

      // Check if runtime bridge is available
      if (typeof initEntities !== 'function') {
        console.log('Runtime bridge not available - showing empty state');
        return;
      }

      try {
        // Add timeout to prevent hanging
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Initialization timeout')), 5000)
        );
        
        const initPromise = (async () => {
          entities = await initEntities();
          for (const name of Object.keys(entities)) {
            records[name] = await apiFetchRecords(name);
          }
        })();

        await Promise.race([initPromise, timeoutPromise]);
        
        // Check if we have any data
        const hasData = Object.values(records).some(r => r && r.length > 0);
        
        if (hasData) {
          render();
        }
        // Otherwise keep the empty state
      } catch (err) {
        console.error('Failed to initialize:', err);
        // Keep the empty state on error
      }
    });

    window.onRecordsChanged = async () => {
      for (const name of Object.keys(entities)) {
        records[name] = await apiFetchRecords(name);
      }
      const hasData = Object.values(records).some(r => r && r.length > 0);
      if (hasData) {
        render();
      } else {
        document.getElementById('app').innerHTML = renderEmptyState();
      }
    };

    function go(view, params = {}) {
      state.view = view;
      Object.assign(state, params);
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      const app = document.getElementById('app');
      if (state.view === 'landing') app.innerHTML = renderLanding();
      else if (state.view === 'entity-list') app.innerHTML = renderEntityList();
      else if (state.view === 'record-detail') app.innerHTML = renderRecordDetail();
      else if (state.view === 'precedence') app.innerHTML = renderPrecedence();
      else if (state.view === 'quality') app.innerHTML = renderQuality();
      else if (state.view === 'lists') app.innerHTML = renderLists();
      else if (state.view === 'schema-builder') app.innerHTML = renderSchemaBuilder();
      else if (state.view === 'schema-entity-detail') app.innerHTML = renderSchemaEntityDetail();
      else if (state.view === 'standardized-lists') app.innerHTML = renderStandardizedLists();
      else if (state.view === 'standardized-list-detail') app.innerHTML = renderStandardizedListDetail();
      else if (state.view === 'grid-view') app.innerHTML = renderUnifiedGrid();
    }

    function fmt$(n) {
      if (n == null) return '—';
      return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function qualityColor(q) {
      if (q >= 95) return 'var(--green)';
      if (q >= 85) return 'var(--accent-2)';
      if (q >= 75) return 'var(--amber)';
      return 'var(--red)';
    }

    function trendArrow(t) {
      if (t > 0) return '<span class="trend-up">▲</span>';
      if (t < 0) return '<span class="trend-down">▼</span>';
      return '<span class="trend-flat">▬</span>';
    }

    function srcBadge(src) {
      const s = sources[src];
      if (!s) return '';
      return `<span class="src-badge" style="border-color: ${s.hex}; color: ${s.hex};"><span class="dot" style="background: ${s.hex};"></span>${s.name}</span>`;
    }

    function renderLanding() {
      const fundCount = (records.Fund || []).length;
      const issuerCount = (records.Issuer || []).length;
      const securityCount = (records.Security || []).length;
      const positionCount = (records.Position || []).length;
      const dqCount = (records.DQException || []).filter(e => e.status === 'open').length;

      return `
        <div class="view-fade">
          <div class="hero">
            <div>
              <div class="hero-eyebrow">Private Assets Portal</div>
              <div class="hero-title">Unified master data for <em>private markets</em></div>
              <div class="hero-sub">Bi-temporal golden records with multi-source lineage, field-level precedence, and data quality governance across funds, issuers, securities, and positions.</div>
            </div>
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" placeholder="Search records, IDs, or fields..." />
              <span class="kbd">⌘K</span>
            </div>
          </div>

          <div class="stat-strip">
            <div class="stat">
              <div class="stat-label">Total Records</div>
              <div class="stat-val">${(fundCount + issuerCount + securityCount + positionCount).toLocaleString()}<sup>+</sup></div>
              <div class="stat-sub"><span class="up">↑ 2.4%</span> vs last week</div>
            </div>
            <div class="stat">
              <div class="stat-label">Active Sources</div>
              <div class="stat-val">7</div>
              <div class="stat-sub">All feeds operational</div>
            </div>
            <div class="stat">
              <div class="stat-label">Data Quality</div>
              <div class="stat-val" style="color: var(--green);">94.2<sup>%</sup></div>
              <div class="stat-sub"><span class="up">↑ 1.8%</span> week-over-week</div>
            </div>
            <div class="stat">
              <div class="stat-label">Open Exceptions</div>
              <div class="stat-val" style="color: ${dqCount > 0 ? 'var(--red)' : 'var(--ink)'};">${dqCount}</div>
              <div class="stat-sub">${dqCount > 0 ? '<span class="warn">Requires attention</span>' : 'All clear'}</div>
            </div>
          </div>

          <div class="section-title">
            <h2>Entity Domains</h2>
            <div class="hint">Click to explore records</div>
          </div>

          <div class="entity-grid">
            <div class="entity-card" style="--card-accent: var(--accent);" onclick="go('entity-list', {entity: 'Fund'})">
              <div class="entity-head">
                <div class="entity-icon">F</div>
                <div class="entity-count"><div class="num">${fundCount}</div><div class="lbl">Records</div></div>
              </div>
              <div class="entity-name">Funds</div>
              <div class="entity-desc">Investment vehicles, NAV, inception dates, managers, and administrators.</div>
              <div class="entity-sources">
                <span class="src-tag">Allvue</span>
                <span class="src-tag">DealCloud</span>
                <span class="src-tag">Manual</span>
              </div>
              <div class="entity-footer">
                <div class="entity-quality">
                  <div class="lbl">Quality</div>
                  <div class="val" style="color: var(--green);">96<span style="font-size: 14px; color: var(--ink-3);">%</span></div>
                </div>
                <div style="font-size: 11px; color: var(--ink-3);">3 stewards</div>
              </div>
            </div>

            <div class="entity-card" style="--card-accent: var(--accent-2);" onclick="go('entity-list', {entity: 'Issuer'})">
              <div class="entity-head">
                <div class="entity-icon">I</div>
                <div class="entity-count"><div class="num">${issuerCount}</div><div class="lbl">Records</div></div>
              </div>
              <div class="entity-name">Issuers</div>
              <div class="entity-desc">Debt and equity issuers with credit ratings, industry sectors, and LEI.</div>
              <div class="entity-sources">
                <span class="src-tag">Bloomberg</span>
                <span class="src-tag">S&P Capital IQ</span>
                <span class="src-tag">WSO</span>
              </div>
              <div class="entity-footer">
                <div class="entity-quality">
                  <div class="lbl">Quality</div>
                  <div class="val" style="color: var(--accent-2);">89<span style="font-size: 14px; color: var(--ink-3);">%</span></div>
                </div>
                <div style="font-size: 11px; color: var(--ink-3);">2 stewards</div>
              </div>
            </div>

            <div class="entity-card" style="--card-accent: var(--gold);" onclick="go('entity-list', {entity: 'Security'})">
              <div class="entity-head">
                <div class="entity-icon">S</div>
                <div class="entity-count"><div class="num">${securityCount}</div><div class="lbl">Records</div></div>
              </div>
              <div class="entity-name">Securities</div>
              <div class="entity-desc">Bonds, loans, equities, and derivatives with ISIN, CUSIP, and pricing.</div>
              <div class="entity-sources">
                <span class="src-tag">Bloomberg</span>
                <span class="src-tag">WSO</span>
                <span class="src-tag">S&P Capital IQ</span>
              </div>
              <div class="entity-footer">
                <div class="entity-quality">
                  <div class="lbl">Quality</div>
                  <div class="val" style="color: var(--gold);">92<span style="font-size: 14px; color: var(--ink-3);">%</span></div>
                </div>
                <div style="font-size: 11px; color: var(--ink-3);">4 stewards</div>
              </div>
            </div>

            <div class="entity-card" style="--card-accent: var(--green);" onclick="go('entity-list', {entity: 'Position'})">
              <div class="entity-head">
                <div class="entity-icon">P</div>
                <div class="entity-count"><div class="num">${positionCount}</div><div class="lbl">Records</div></div>
              </div>
              <div class="entity-name">Positions</div>
              <div class="entity-desc">Fund-security intersections with market value, par notional, and P&L.</div>
              <div class="entity-sources">
                <span class="src-tag">Allvue</span>
                <span class="src-tag">DealCloud</span>
              </div>
              <div class="entity-footer">
                <div class="entity-quality">
                  <div class="lbl">Quality</div>
                  <div class="val" style="color: var(--green);">94<span style="font-size: 14px; color: var(--ink-3);">%</span></div>
                </div>
                <div style="font-size: 11px; color: var(--ink-3);">2 stewards</div>
              </div>
            </div>

            <div class="entity-card" style="--card-accent: var(--red);" onclick="go('quality')">
              <div class="entity-head">
                <div class="entity-icon" style="font-size: 28px;">⚠</div>
                <div class="entity-count"><div class="num">${dqCount}</div><div class="lbl">Open</div></div>
              </div>
              <div class="entity-name">DQ Exceptions</div>
              <div class="entity-desc">Data quality exceptions requiring review: availability, tolerance, trajectory.</div>
              <div class="entity-sources">
                <span class="src-tag">Availability</span>
                <span class="src-tag">Tolerance</span>
                <span class="src-tag">Trajectory</span>
              </div>
              <div class="entity-footer">
                <div class="entity-quality">
                  <div class="lbl">Severity</div>
                  <div class="val" style="color: ${dqCount > 10 ? 'var(--red)' : 'var(--amber)'};">${dqCount > 10 ? 'High' : 'Med'}</div>
                </div>
                <div style="font-size: 11px; color: var(--ink-3);">Review queue</div>
              </div>
            </div>
          </div>

          <div class="section-title">
            <h2>Cross-Cutting Tools</h2>

      const fields = schemaFields.filter(f => f.entity_id === entityId).sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
      const parentRels = schemaRels.filter(r => r.child_entity_id === entityId);
      const childRels = schemaRels.filter(r => r.parent_entity_id === entityId);
      const entityExprCols = exprColumns.filter(e => e.entity_id === entityId).sort((a, b) => (a.display_order || 0) - (b.display_order || 0));

      return `

            <span class="crumb-link" onclick="go('landing')">Home</span>
            <span class="sep">›</span>
            <span class="crumb-link" onclick="go('schema-builder')">Schema Builder</span>
            <span class="sep">›</span>
            <span class="crumb-current">${entity.display_name || entity.name}</span>
          </div>

          <div class="entity-detail-header">
            <div class="entity-detail-meta">
              <span class="schema-entity-role ${entity.entity_role === 'fact' ? 'role-fact' : entity.entity_role === 'dimension' ? 'role-dimension' : entity.entity_role === 'bridge' ? 'role-bridge' : 'role-date-dim'}">${entity.entity_role || 'fact'}</span>

                <div class="entity-stat-lbl">Fields</div>
              </div>
              <div class="entity-stat">
                <div class="entity-stat-val">${entityExprCols.length}</div>
                <div class="entity-stat-lbl">Expressions</div>
              </div>
              <div class="entity-stat">
                <div class="entity-stat-val">${parentRels.length + childRels.length}</div>
                <div class="entity-stat-lbl">Relationships</div>
              </div>
            </div>
          </div>

          ${parentRels.length > 0 || childRels.length > 0 ? `
            <div class="rel-section">
              <div class="rel-section-head">
                <div class="rel-section-title">Relationships</div>
                <button class="btn btn-sm" onclick="openRelationshipModal('${entityId}')">+ Add Relationship</button>
              </div>
              ${parentRels.map(rel => {
                const parent = schemaEntities.find(e => e.id === rel.parent_entity_id);
                return `
                  <div class="rel-pill">
                    <span>${parent ? parent.display_name : 'Unknown'}</span>
                    <span class="rel-pill-arrow">→</span>

                  </div>

                    <span class="rel-pill-arrow">→</span>
                    <span>${child ? child.display_name : 'Unknown'}</span>
                    <span class="rel-pill-cardinality">${rel.cardinality || '1:N'}</span>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="rel-section">
              <div class="rel-section-head">
                <div class="rel-section-title">Relationships</div>
                <button class="btn btn-sm" onclick="openRelationshipModal('${entityId}')">+ Add Relationship</button>

              <div>#</div>
              <div>Field Name</div>
              <div>Type</div>
              <div style="text-align: center;">Required</div>
              <div style="text-align: center;">PK</div>
              <div style="text-align: center;">FK</div>
              <div>References</div>
              <div>Actions</div>
            </div>
            ${fields.map((f, idx) => `
              <div class="field-table-row">
                <div class="field-order">${idx + 1}</div>
                <div class="field-name-cell">
                  <div class="field-name-main">${f.name}</div>
                  ${f.display_name && f.display_name !== f.name ? `<div class="field-name-display">${f.display_name}</div>` : ''}
                </div>

                  <button class="field-action-btn" onclick="openFieldModal('${entityId}', '${f.id}')">Edit</button>

                  <button class="field-action-btn delete" onclick="deleteField('${f.id}')">Delete</button>

          <div style="margin-top: 18px; text-align: center;">
            <button class="btn btn-primary" onclick="openFieldModal('${entityId}')">+ Add Field</button>
          </div>

          <div class="expr-section" style="margin-top: 28px;">
            <div class="expr-section-head">
              <div class="expr-section-title">Expression Columns</div>
              <button class="btn btn-sm" onclick="openExpressionModal('${entityId}')">+ Add Expression</button>
            </div>
            ${entityExprCols.length > 0 ? entityExprCols.map(expr => `
              <div class="expr-card">
                <div class="expr-head">
                  <div>
                    <div class="expr-name">${expr.display_name || expr.name}</div>
                    <div style="font-size: 11px; color: var(--ink-4); margin-top: 2px;">${expr.name}</div>
                  </div>
                  <div style="display: flex; gap: 6px; align-items: center;">
                    <span class="expr-type">${expr.output_type || 'string'}</span>
                    <button class="field-action-btn" onclick="openExpressionModal('${entityId}', '${expr.id}')">Edit</button>
                    <button class="field-action-btn delete" onclick="deleteExpression('${expr.id}')">Delete</button>
                  </div>
                </div>
                <div class="expr-formula">${expr.expression}</div>
                ${expr.depends_on_fields ? `
                  <div class="expr-deps">
                    <span class="expr-deps-label">Depends on:</span>
                    ${expr.depends_on_fields.split(',').map(f => `<span class="expr-dep-chip">${f.trim()}</span>`).join('')}
                  </div>
                ` : ''}
                ${expr.description ? `<div style="font-size: 12px; color: var(--ink-3); margin-top: 8px;">${expr.description}</div>` : ''}
              </div>
            `).join('') : `
              <div style="padding: 20px; text-align: center; color: var(--ink-4); font-size: 12px;">
                No expression columns defined yet
              </div>
            `}
          </div>

          <div class="expr-section" style="margin-top: 28px;">
            <div class="expr-section-head">
              <div class="expr-section-title">Link Types</div>
              <button class="btn btn-sm" onclick="openLinkTypeModal('${entityId}')">+ Add Link Type</button>
            </div>
            ${(() => {
              const linkTypes = (records.LinkType || []).filter(lt => lt.source_entity_id === entityId || lt.target_entity_id === entityId);
              return linkTypes.length > 0 ? linkTypes.map(lt => {
                const sourceEntity = schemaEntities.find(e => e.id === lt.source_entity_id);
                const targetEntity = schemaEntities.find(e => e.id === lt.target_entity_id);
                const isSource = lt.source_entity_id === entityId;
                return `
                  <div class="expr-card">
                    <div class="expr-head">
                      <div>
                        <div class="expr-name">${lt.display_name || lt.name}</div>
                        <div style="font-size: 11px; color: var(--ink-4); margin-top: 2px;">${lt.name}</div>
                      </div>
                      <div style="display: flex; gap: 6px; align-items: center;">
                        <span class="expr-type">${lt.cardinality || 'N:M'}</span>
                        <button class="field-action-btn" onclick="openLinkTypeModal('${entityId}', '${lt.id}')">Edit</button>
                        <button class="field-action-btn delete" onclick="deleteLinkType('${lt.id}')">Delete</button>
                      </div>
                    </div>
                    <div style="font-size: 12px; color: var(--ink-3); margin-top: 8px;">
                      ${isSource ? 'Links to' : 'Linked from'}: <strong>${isSource ? (targetEntity?.display_name || 'Unknown') : (sourceEntity?.display_name || 'Unknown')}</strong>
                      ${lt.is_bidirectional ? ' <span style="color: var(--accent);">↔ Bidirectional</span>' : ''}
                    </div>
                    ${lt.description ? `<div style="font-size: 12px; color: var(--ink-3); margin-top: 8px;">${lt.description}</div>` : ''}
                  </div>
                `;
              }).join('') : `
                <div style="padding: 20px; text-align: center; color: var(--ink-4); font-size: 12px;">
                  No link types defined yet
                </div>
              `;
            })()}
          </div>

          ${renderTemplateSection(entityId, fields)}
        </div>
      `;
    }

    async function saveEntity(editId) {
      const name = document.getElementById('entity-name').value.trim();
      const displayName = document.getElementById('entity-display-name').value.trim();
      const description = document.getElementById('entity-description').value.trim();
      const role = document.getElementById('entity-role').value;
      const dateGran = document.getElementById('entity-date-gran').value;
      const parentTypeId = document.getElementById('entity-parent-type').value;
      const isAbstract = document.getElementById('entity-is-abstract').checked;
      const isDateDim = document.getElementById('entity-is-date-dim').checked;

      if (!name) {
        alert('Entity name is required');
        return;
      }

      const data = {
        name,
        display_name: displayName || name,
        description,
        entity_role: role,
        parent_type_id: parentTypeId,
        is_abstract: isAbstract,
        date_granularity: dateGran,
        is_date_dimension: isDateDim,
        created_at: new Date().toISOString()
      };

      try {
        if (editId) {
          await apiUpdateRecord('SchemaEntity', editId, data);
        } else {
          await apiCreateRecord('SchemaEntity', data);
        }
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to save entity: ' + err.message);
      }
    }

    async function saveField(entityId, editId) {
      const name = document.getElementById('field-name').value.trim();
      const displayName = document.getElementById('field-display-name').value.trim();
      const fieldType = document.getElementById('field-type').value;
      const displayOrder = parseInt(document.getElementById('field-order').value) || 0;
      const validation = document.getElementById('field-validation').value.trim();
      const defaultValue = document.getElementById('field-default').value.trim();
      const isRequired = document.getElementById('field-required').checked;
      const isPK = document.getElementById('field-pk').checked;
      const isFK = document.getElementById('field-fk').checked;
      const referencesEntity = document.getElementById('field-references').value;
      
      const subtypeIds = Array.from(document.querySelectorAll('.field-subtype-check:checked')).map(cb => cb.value);
      const appliesToTypeIds = subtypeIds.join(',');

      if (!name) {
        alert('Field name is required');
        return;
      }

      const data = {
        entity_id: entityId,
        name,
        display_name: displayName || name,
        field_type: fieldType,
        display_order: displayOrder,
        validation_rule: validation,
        default_value: defaultValue,
        is_required: isRequired,
        is_primary_key: isPK,
        is_foreign_key: isFK,
        references_entity: isFK ? referencesEntity : '',
        applies_to_type_ids: appliesToTypeIds
      };

      try {
        if (editId) {
          await apiUpdateRecord('SchemaField', editId, data);
        } else {
          await apiCreateRecord('SchemaField', data);
        }
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to save field: ' + err.message);
      }
    }

    async function deleteField(fieldId) {
      if (!confirm('Delete this field? This cannot be undone.')) return;
      try {
        await apiDeleteRecord('SchemaField', fieldId);
        render();
      } catch (err) {
        alert('Failed to delete field: ' + err.message);
      }
    }

    async function saveBinding(fieldId) {
      const listId = document.getElementById('bind-list-id').value;
      const isRequired = document.getElementById('bind-is-required').checked;
      
      const fieldBindings = records.FieldListBinding || [];
      const existingBinding = fieldBindings.find(b => b.field_id === fieldId);

      try {
        if (!listId) {
          // Remove binding if no list selected
          if (existingBinding) {
            await apiDeleteRecord('FieldListBinding', existingBinding.id);
          }
        } else if (existingBinding) {
          // Update existing binding
          await apiUpdateRecord('FieldListBinding', existingBinding.id, {
            list_id: listId,
            is_required: isRequired
          });
        } else {
          // Create new binding
          await apiCreateRecord('FieldListBinding', {
            field_id: fieldId,
            list_id: listId,
            is_required: isRequired
          });
        }
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to save binding: ' + err.message);

    }

    async function addListValue(listId) {
      const newValue = document.getElementById('new-value').value.trim();
      if (!newValue) {
        alert('Value is required');
        return;
      }

      const stdLists = records.StandardizedList || [];
      const list = stdLists.find(l => l.id === listId);
      if (!list) return;

      const values = list.values ? list.values.split(',').map(v => v.trim()) : [];
      if (values.includes(newValue)) {
        alert('Value already exists');
        return;
      }

      values.push(newValue);
      const newValues = values.join(',');

      try {
        await apiUpdateRecord('StandardizedList', listId, { values: newValues });
        document.querySelector('.modal-overlay').remove();
        render();
      } catch (err) {
        alert('Failed to add value: ' + err.message);
      }
    }

    async function removeListValue(listId, index) {
      if (!confirm('Remove this value from the list?')) return;

      const stdLists = records.StandardizedList || [];
      const list = stdLists.find(l => l.id === listId);
      if (!list) return;

      const values = list.values ? list.values.split(',').map(v => v.trim()) : [];
      values.splice(index, 1);
      const newValues = values.join(',');

      try {
        await apiUpdateRecord('StandardizedList', listId, { values: newValues });
        render();
      } catch (err) {
        alert('Failed to remove value: ' + err.message);
      }
    }
